workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Prepare project
        script: |
          flutter create --org com.zeyad.germanapp --project-name german_app .
          mkdir -p lib
          sed '/^const words/,/^};/d' main.dart > t1.dart
          sed '/^const lessons/,/^};/d' t1.dart > lib/main.dart
          W=""
          LS=""
          for l in a1 a2 b1 b2 c1; do
            if [ -f "$l.dart" ]; then
              cat "$l.dart" >> lib/main.dart
              U=$(echo $l | tr a-z A-Z)
              W="$W '$U': words$U,"
              LS="$LS '$U': lessons$U,"
            fi
          done
          echo "const words = <String, List<W>>{$W};" >> lib/main.dart
          echo "const lessons = <String, List<L>>{$LS};" >> lib/main.dart
          flutter pub add flutter_tts
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
